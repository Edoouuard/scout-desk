function relevance(d){

  m.innerHTML=`<div class="topbar"><div><h1>Thesis & settings</h1><p class="sub">Relevance scoring, Slack channel, backups.</p></div></div>
  <div class="grid2"><div class="panel pad"><div class="field"><label>Your name (used in outreach drafts)</label><input id="tName" value="${esc(thesis.scoutName)}"></div><div class="field"><label>Fund or firm you scout for</label><input id="tFund" value="${esc(thesis.fund)}"></div>${chip("sectors","Sectors")}${chip("stages","Stages")}${chip("geos","Geographies")}${chip("keywords","Keywords that bump the score")}</div>
  <div class="panel pad"><div class="field"><label>Freshness half-life (days)</label><input id="tHalf" type="number" min="1" max="90" value="${thesis.halfLifeDays}"></div><div class="field"><label>Slack channel for alerts</label><input id="tSlack" value="${esc(thesis.slackChannel)}"></div><div class="field"><label>Appearance</label><select id="tTheme"><option value="">Follow system</option><option value="light" ${thesis.theme==="light"?"selected":""}>Light</option><option value="dark" ${thesis.theme==="dark"?"selected":""}>Dark</option></select></div><button class="btn primary" id="tSave">Save settings</button>
  <div style="margin-top:22px;border-top:1px solid var(--line2);padding-top:14px"><h2 style="font-size:15px">Backups</h2><div class="row"><button class="btn sm" id="tExport">Export everything (JSON)</button><button class="btn sm" id="tImport">Import JSON</button><button class="btn sm" id="tCsv">Export CSV</button></div><p class="small muted" style="margin:8px 0 0">Data lives in this browser only. Export a JSON backup regularly, or paste it into the seed in index.html to make it permanent.</p><div class="row" style="margin-top:10px"><button class="btn sm ghost danger" id="tReset">Reset to seed dealflow</button></div></div></div></div>`;
  wire(m);
  const t=JSON.parse(JSON.stringify(thesis));
  m.querySelectorAll("[data-addchip]").forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();t[inp.dataset.addchip].push(inp.value.trim());saveThesis(t);}});
  m.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.rm.split(":");t[k].splice(+i,1);saveThesis(t);});
  m.querySelector("#tSave").onclick=()=>{t.scoutName=m.querySelector("#tName").value.trim();t.fund=m.querySelector("#tFund").value.trim();t.halfLifeDays=Math.max(1,+m.querySelector("#tHalf").value||14);t.slackChannel=m.querySelector("#tSlack").value.trim();t.theme=m.querySelector("#tTheme").value;saveThesis(t);applyTheme();toast("Settings saved");};
  m.querySelector("#tExport").onclick=()=>download("scout-desk.json",JSON.stringify({thesis,deals:Object.values(deals)},null,2),"application/json");
  m.querySelector("#tImport").onclick=()=>openAdd("paste");m.querySelector("#tCsv").onclick=exportCSV;
  m.querySelector("#tReset").onclick=()=>{if(confirm("Replace everything with the seed dealflow from index.html? Your edits will be lost.")){deals={};SEED.forEach(x=>deals[x.id]=normalize(x));save();render();toast("Reset to seed");}};
}
function applyTheme(){if(thesis.theme)document.documentElement.dataset.theme=thesis.theme;else delete document.documentElement.dataset.theme;}

function wire(m){
  m.querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault();selectedId=a.dataset.open;view="inbox";render();});
  m.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{const[id,s]=b.dataset.move.split(":");moveStage(id,s);});
  m.querySelectorAll("[data-draft]").forEach(b=>b.onclick=()=>openDraft(b.dataset.draft));
  m.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openAdd("form",deals[b.dataset.edit]));
  m.querySelectorAll("[data-stagesel]").forEach(s=>s.onchange=()=>moveStage(s.dataset.stagesel,s.value));
  m.querySelectorAll("[data-archive]").forEach(b=>b.onclick=()=>{saveDeal({...deals[b.dataset.archive],archived:true});selectedId=null;toast("Archived");});
  m.querySelectorAll("[data-rel]").forEach(r=>r.onchange=()=>saveDeal({...deals[r.dataset.rel],relevance:+r.value}));
  m.querySelectorAll("[data-addnote]").forEach(b=>b.onclick=()=>{const ta=m.querySelector(`[data-note="${b.dataset.addnote}"]`);if(!ta.value.trim())return;const d={...deals[b.dataset.addnote]};d.notes=[...(d.notes||[]),{at:now(),text:ta.value.trim()}];d.touchedAt=now();saveDeal(d);});
  m.querySelectorAll("[data-slack1]").forEach(b=>b.onclick=()=>copy(slackFor([deals[b.dataset.slack1]],`New deal for ${thesis.slackChannel||"#dealflow"}`)));
  const add=m.querySelector("#btnAdd");if(add)add.onclick=()=>openAdd("form");
}
function moveStage(id,s){const d={...deals[id],stage_k:s,touchedAt:now()};saveDeal(d);toast(`${d.company} → ${stageLabel(s)}`);}

function openAdd(tab,existing){
  const o=document.createElement("div");o.className="overlay";const d=existing||{};const f=(d.founders||[]).slice();while(f.length<3)f.push({});
  o.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="row" style="justify-content:space-between"><h2>${existing?"Edit deal":"Add deal"}</h2><button class="btn sm ghost" id="mClose">Close</button></div>
  ${existing?"":`<div class="tabs"><button data-tab="form" class="${tab==="form"?"active":""}">Fill in</button><button data-tab="paste" class="${tab==="paste"?"active":""}">Import JSON</button></div>`}
  <div id="tabForm" class="${tab==="form"?"":"hidden"}">
  <div class="grid2"><div class="field"><label>Company</label><input id="fCompany" value="${esc(d.company||"")}"></div><div class="field"><label>Website</label><input id="fWeb" value="${esc(d.website||"")}" placeholder="https://"></div></div>
  <div class="field"><label>One line — what they do</label><input id="fLine" value="${esc(d.oneLiner||"")}"></div>
  <div class="grid2"><div class="field"><label>Signal type</label><select id="fType">${SIGNAL_TYPES.map(t=>`<option ${d.signalType===t?"selected":""}>${t}</option>`).join("")}</select></div><div class="field"><label>Signal date</label><input id="fDate" type="date" value="${new Date(d.signalDate||Date.now()).toISOString().slice(0,10)}"></div></div>
  <div class="grid2"><div class="field"><label>Origin</label><select id="fOrigin"><option value="sourced" ${(d.origin||"sourced")==="sourced"?"selected":""}>Sourced by me</option><option value="fund-intro" ${d.origin==="fund-intro"?"selected":""}>Sent by a fund</option><option value="inbound" ${d.origin==="inbound"?"selected":""}>Inbound / referral</option><option value="radar" ${d.origin==="radar"?"selected":""}>Radar</option></select></div><div class="field"><label>Referred by</label><input id="fRef" value="${esc(d.referredBy||"")}" placeholder="Fund or person"></div></div>
  <div class="grid2"><div class="field"><label>Source link</label><input id="fSrc" value="${esc(d.sourceUrl||"")}" placeholder="https://"></div><div class="field"><label>Source name</label><input id="fSrcName" value="${esc(d.sourceName||"")}"></div></div>
  <div class="grid2"><div class="field"><label>Sectors (separate with /)</label><input id="fSector" value="${esc(d.sector||"")}" placeholder="Fintech / Compliance"></div><div class="field"><label>Geo</label><input id="fGeo" value="${esc(d.geo||"")}"></div></div>
  <div class="grid2"><div class="field"><label>Round / stage</label><input id="fStage" value="${esc(d.stage||"")}" placeholder="Seed, Series A, Stealth…"></div><div class="field"><label>Amount</label><input id="fAmt" value="${esc(d.amount||"")}"></div></div>
  <div class="grid2"><div class="field"><label>Investors</label><input id="fInv" value="${esc(d.investors||"")}"></div><div class="field"><label>Tags (comma separated)</label><input id="fTags" value="${esc((d.tags||[]).join(", "))}"></div></div>
  <div class="field"><label>Pipeline stage</label><select id="fK">${STAGES.map(s=>`<option value="${s[0]}" ${(d.stage_k||"new")===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select></div>
  <h2 style="font-size:15px;margin-top:6px">Founders</h2>${f.slice(0,3).map((x,i)=>`<div class="grid2"><div class="field"><label>Name</label><input data-fn="${i}" value="${esc(x.name||"")}"></div><div class="field"><label>Role / background</label><input data-fr="${i}" value="${esc(x.role||"")}"></div></div><div class="grid2"><div class="field"><label>LinkedIn</label><input data-fl="${i}" value="${esc(x.linkedin||"")}"></div><div class="field"><label>Email</label><input data-fe="${i}" value="${esc(x.email||"")}"></div></div>`).join("")}
  <div class="row" style="justify-content:flex-end;margin-top:6px">${existing?`<button class="btn ghost danger" id="mDelete">Delete</button>`:""}<button class="btn primary" id="mSave">${existing?"Save changes":"Add to inbox"}</button></div></div>
  <div id="tabPaste" class="${tab==="paste"?"":"hidden"}"><p class="small muted" style="margin:0 0 8px">Paste a JSON array of deals (or a full backup exported from Settings). Companies already on the desk are skipped.</p><textarea id="pText" style="min-height:200px" placeholder='[{"company":"…","website":"…","oneLiner":"…","stage":"Seed","founders":[{"name":"…","linkedin":"…"}]}]'></textarea><div class="row" style="margin-top:8px;justify-content:space-between"><span class="small" id="pStatus"></span><button class="btn primary" id="pRun">Import</button></div></div></div>`;
  document.body.appendChild(o);const $=s=>o.querySelector(s);const close=()=>o.remove();
  $("#mClose").onclick=close;o.onclick=e=>{if(e.target===o)close();};
  o.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{o.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));$("#tabForm").classList.toggle("hidden",b.dataset.tab!=="form");$("#tabPaste").classList.toggle("hidden",b.dataset.tab!=="paste");});
  $("#mSave").onclick=()=>{const company=$("#fCompany").value.trim();if(!company){toast("Company name is required");return;}
    const founders=[0,1,2].map(i=>({name:$(`[data-fn="${i}"]`).value.trim(),role:$(`[data-fr="${i}"]`).value.trim(),linkedin:$(`[data-fl="${i}"]`).value.trim(),email:$(`[data-fe="${i}"]`).value.trim()})).filter(x=>x.name);
    const nd={...d,id:d.id||uid(),company,website:$("#fWeb").value.trim(),oneLiner:$("#fLine").value.trim(),signalType:$("#fType").value,signalDate:new Date($("#fDate").value).getTime()||now(),origin:$("#fOrigin").value,referredBy:$("#fRef").value.trim(),sourceUrl:$("#fSrc").value.trim(),sourceName:$("#fSrcName").value.trim(),sector:$("#fSector").value.trim(),geo:$("#fGeo").value.trim(),stage:$("#fStage").value.trim(),amount:$("#fAmt").value.trim(),investors:$("#fInv").value.trim(),tags:$("#fTags").value.split(",").map(s=>s.trim()).filter(Boolean),stage_k:$("#fK").value,founders,addedAt:d.addedAt||now(),touchedAt:now(),notes:d.notes||[]};
    delete nd.relevance;saveDeal(nd);selectedId=nd.id;close();toast(existing?"Saved":"Added to inbox");};
  if($("#mDelete"))$("#mDelete").onclick=()=>{if(confirm(`Delete ${d.company}?`)){deleteDeal(d.id);selectedId=null;close();}};
  $("#pRun").onclick=()=>{let items;try{const j=JSON.parse($("#pText").value);items=Array.isArray(j)?j:(j.deals||[]);if(j.thesis)saveThesis({...DEFAULT_THESIS,...j.thesis});}catch(e){$("#pStatus").textContent="That isn't valid JSON.";return;}
    const names=new Set(Object.values(deals).map(x=>x.company.toLowerCase()));let n=0;items.forEach(x=>{if(!x.company||names.has(String(x.company).toLowerCase()))return;const nd=normalize({...x,id:x.id&&!deals[x.id]?x.id:uid()});deals[nd.id]=nd;n++;});save();close();toast(`${n} deal${n===1?"":"s"} imported`);view="inbox";render();};
}

function draftFor(d,channel,angle,founderName){
  const first=(founderName||"").split(" ")[0]||"there";const me=thesis.scoutName||"[your name]";const fund=thesis.fund?` — I scout early-stage deals for ${thesis.fund}`:" — I scout early-stage deals";
  const what=d.oneLiner?d.oneLiner.charAt(0).toLowerCase()+d.oneLiner.slice(1):"what you're building";
  const hook=d.signalType==="Stealth"?`I understand you're working on something new${d.oneLiner?` around ${what}`:""}.`:d.origin==="fund-intro"?`${d.referredBy||"A fund I work with"} mentioned ${d.company}${d.oneLiner?` and ${what}`:""}.`:d.amount&&/rais/i.test(d.signalType||"")?`I saw ${d.company} is raising a ${d.stage||"round"}${d.amount?` (${d.amount})`:""} for ${what}.`:`I came across ${d.company}${d.oneLiner?` — ${what}`:""}.`;
  const why=angle?angle:(thesis.sectors.length?`${d.sector||"This space"} is squarely where I spend my time (${thesis.sectors.slice(0,3).join(", ")}).`:"");
  const body=`Hi ${first},\n\n${hook} ${why}\n\nI'm ${me}${fund}. Would you have 20 minutes this week or next to walk me through it? Happy to share who else I'd bring it to.\n\n${me}`;
  if(channel==="LinkedIn message"||channel==="X DM")return`Hi ${first} — ${hook.replace(/^I /,"I ")} ${why} I'm ${me}${fund}. Open to a 20-min call this or next week?`;
  return body;
}
function openDraft(id){
  const d=deals[id];if(!d)return;const o=document.createElement("div");o.className="overlay";const founder=(d.founders||[])[0];
  o.innerHTML=`<div class="modal"><div class="row" style="justify-content:space-between"><h2>Outreach — ${esc(d.company)}</h2><button class="btn sm ghost" id="dClose">Close</button></div>
  <div class="grid2"><div class="field"><label>To</label><input id="dTo" value="${esc(founder?founder.name:"")}" placeholder="Founder name"></div><div class="field"><label>Channel</label><select id="dCh"><option>Email</option><option>LinkedIn message</option><option>X DM</option></select></div></div>
  <div class="field"><label>Your angle — why you, why now (optional)</label><input id="dAngle" placeholder="e.g. we backed two companies in this space; a fund I work with asked me to look"></div>
  <div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="btn" id="dGen">${d.draft?"Regenerate from facts":"Generate draft"}</button></div>
  <textarea id="dText" class="draft" style="min-height:220px">${esc(d.draft||draftFor(d,"Email","",founder?.name))}</textarea>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="small muted">Generated from the deal's own facts — no invented claims.</span><div class="row"><button class="btn" id="dCopy">Copy</button>${founder?.email?`<a class="btn" id="dMail" href="#">Open in mail</a>`:""}${founder?.linkedin?`<a class="btn" href="${esc(founder.linkedin)}" target="_blank" rel="noopener">Open LinkedIn</a>`:""}<button class="btn primary" id="dSave">Save & mark contacted</button></div></div></div>`;
  document.body.appendChild(o);const $=s=>o.querySelector(s);const close=()=>o.remove();
  $("#dClose").onclick=close;o.onclick=e=>{if(e.target===o)close();};
  $("#dGen").onclick=()=>{$("#dText").value=draftFor(d,$("#dCh").value,$("#dAngle").value.trim(),$("#dTo").value.trim());};
  $("#dCh").onchange=$("#dGen").onclick;
  $("#dCopy").onclick=()=>copy($("#dText").value);
  const mail=$("#dMail");if(mail)mail.onclick=e=>{e.preventDefault();location.href=`mailto:${encodeURIComponent(founder.email)}?subject=${encodeURIComponent(d.company+" — quick call?")}&body=${encodeURIComponent($("#dText").value)}`;};
  $("#dSave").onclick=()=>{saveDeal({...d,draft:$("#dText").value,stage_k:["new","reviewing"].includes(d.stage_k)?"contacted":d.stage_k,touchedAt:now()});close();toast("Draft saved");};
}
function exportCSV(){const cols=["company","oneLiner","signalType","signalDate","stage_k","stage","amount","sector","geo","investors","origin","referredBy","website","sourceUrl","founders","linkedin","score"];const rows=[cols.join(",")].concat(sorted(active()).map(d=>{const v={...d,signalDate:new Date(d.signalDate).toISOString().slice(0,10),founders:(d.founders||[]).map(f=>f.name).join("; "),linkedin:(d.founders||[]).map(f=>f.linkedin).filter(Boolean).join("; "),score:rank(d)};return cols.map(c=>`"${String(v[c]??"").replace(/"/g,'""')}"`).join(",");}));download("scout-desk.csv",rows.join("\n"),"text/csv");}

document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
const added=load();applyTheme();render();loadRadar();
if(added&&Object.keys(deals).length>added)toast(`${added} new deal${added===1?"":"s"} merged from the seed`);
</script>
</body>
</html>
