<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout desk</title>
<!-- Favicon (inline SVG) -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--panel:#fff;--panel2:#f6f7f9;--ink:#1c2230;--ink2:#5b6474;--ink3:#8d95a3;--line:#dfe3e9;--line2:#eceef2;--teal:#0f6e63;--teal2:#0b5b52;--teal-soft:#e2f1ee;--fresh:#e6a817;--fresh-soft:#fbf1d6;--fresh-ink:#7a5a00;--rose:#b9433d;--rose-soft:#f8e4e2;--nav:#182033;--nav-ink:#c8cfdc;--nav-active:#25314c;--shadow:0 1px 2px rgba(20,28,45,.06);--ui:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--serif:"Newsreader",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--panel:#1a2030;--panel2:#202839;--ink:#e8ebf1;--ink2:#a9b1c0;--ink3:#727b8c;--line:#2b3446;--line2:#242c3d;--teal:#4fb8a9;--teal2:#6fcdbf;--teal-soft:#183531;--fresh:#e9b53a;--fresh-soft:#3a3117;--fresh-ink:#e9b53a;--rose:#e07b74;--rose-soft:#3d2422;--nav:#0e1320;--nav-ink:#aeb6c6;--nav-active:#1c2537;--shadow:none}}
:root[data-theme="dark"]{--bg:#121722;--panel:#1a2030;--panel2:#202839;--ink:#e8ebf1;--ink2:#a9b1c0;--ink3:#727b8c;--line:#2b3446;--line2:#242c3d;--teal:#4fb8a9;--teal2:#6fcdbf;--teal-soft:#183531;--fresh:#e9b53a;--fresh-soft:#3a3117;--fresh-ink:#e9b53a;--rose:#e07b74;--rose-soft:#3d24222;--nav:#0e1320;--nav-ink:#aeb6c6;--nav-active:#1c2537;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
textarea{resize:vertical;min-height:90px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:22px;color:#fff;padding:4px 10px 16px}
.brand small{display:block;font-family:var(--ui);font-size:11px;color:var(--ink3);margin-top:2px}
.navbtn{display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-radius:6px;padding:8px 10px;text-align:left;color:var(--nav-ink);width:100%}
.navbtn:hover{background:var(--nav-active)}.navbtn.active{background:var(--nav-active);color:#fff}
.navbtn .n{font-size:11px;background:rgba(255,255,255,.1);border-radius:10px;padding:1px 7px;min-width:20px;text-align:center}
.navsep{height:1px;background:rgba(255,255,255,.08);margin:10px 4px}
.navfoot{margin-top:auto;font-size:11px;color:var(--ink3);padding:8px 10px;line-height:1.5}
main{padding:26px 32px 60px;min-width:0}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:0}h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 10px}
.sub{color:var(--ink2);margin:4px 0 0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;box-shadow:var(--shadow);text-decoration:none;display:inline-block}
.btn:hover{background:var(--panel2)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal2)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.ghost{border-color:transparent;box-shadow:none;background:none;color:var(--ink2)}.btn.ghost:hover{background:var(--panel2);color:var(--ink)}.btn.ghost[...]
/* rest of CSS unchanged */
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">Scout desk<small id="brandSub">private dealflow workspace</small></div>
    <button class="navbtn" data-view="digest">Daily digest <span class="n" id="nDigest">0</span></button>
    <button class="navbtn" data-view="radar">Radar <span class="n" id="nRadar">–</span></button>
    <button class="navbtn" data-view="inbox">Inbox <span class="n" id="nInbox">0</span></button>
    <button class="navbtn" data-view="board">Deal board <span class="n" id="nBoard">0</span></button>
    <button class="navbtn" data-view="founders">Founders <span class="n" id="nFounders">0</span></button>
    <button class="navbtn" data-view="outreach">Outreach <span class="n" id="nOutreach">0</span></button>
    <div class="navsep"></div>
    <button class="navbtn" data-view="sources">Sources & import</button>
    <button class="navbtn" data-view="thesis">Thesis & settings</button>
    <div class="navfoot" id="storeNote">Saved in this browser. Export a backup from Settings.</div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* JavaScript unchanged (kept original content) */
</script>
</body>
</html>
