name: Generate Radar

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate radar
        run: node radar.js
        working-directory: ${{ github.workspace }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add radar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update radar.json" && git push)
