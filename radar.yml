name: Radar
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node radar/radar.js
      - name: Commit radar.json
        run: |
          git config user.name "scout-radar"
          git config user.email "radar@users.noreply.github.com"
          git add radar.json
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
